<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="TwitchとYouTubeを最大8画面で視聴し、選択中の配信チャットを切り替えるマルチビューアー。">
    <title>MultiView Desk</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="nav-edge" aria-label="アプリヘッダー">
      <a class="wordmark" href="#main">MultiView</a>
      <p class="capacity" aria-live="polite"><span id="stream-count">0</span> / 8</p>
    </header>

    <main id="main" class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro__copy">
          <h1 id="page-title">配信を追加</h1>
          <p>Twitch / YouTubeを最大8画面。選択した配信のチャットだけを表示します。</p>
        </div>

        <form id="add-form" class="add-form" novalidate>
          <label for="stream-input">URLまたはTwitchチャンネル名</label>
          <div class="add-form__row">
            <input
              id="stream-input"
              name="stream"
              type="text"
              inputmode="url"
              autocomplete="off"
              placeholder="twitch.tv/channel または youtube.com/watch?v=…"
              aria-describedby="stream-helper"
              required
            >
            <button id="add-button" class="button button--primary" type="submit">配信を追加</button>
          </div>
          <p id="stream-helper" class="form-helper">YouTube動画IDは「yt:VIDEO_ID」でも追加できます</p>
        </form>
      </section>

      <div id="protocol-warning" class="notice" role="status" hidden>
        `file://`では公式埋め込みが拒否されることがあります。`npm start`で開いてください。
      </div>

      <section class="workspace" aria-label="マルチビュー作業領域">
        <div class="viewer-pane">
          <div class="viewer-toolbar">
            <div>
              <h2>配信画面</h2>
              <p id="selection-label">配信はまだありません</p>
            </div>
            <button id="chat-toggle" class="button button--quiet" type="button" aria-pressed="true">チャットを隠す</button>
          </div>

          <div id="empty-state" class="empty-state">
            <span class="empty-state__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <div>
              <h2>配信はまだありません。</h2>
              <p>上の入力欄にチャンネル名か配信URLを追加すると、ここに画面が並びます。</p>
            </div>
            <button id="focus-input" class="button button--secondary" type="button">入力欄へ移動</button>
          </div>

          <div id="stream-grid" class="stream-grid" data-count="0" aria-live="polite"></div>
        </div>

        <aside id="chat-panel" class="chat-panel" aria-labelledby="chat-title">
          <header class="chat-panel__header">
            <div>
              <p>選択中のチャット</p>
              <h2 id="chat-title">チャットを選択</h2>
            </div>
            <span id="chat-provider" class="provider-tag">—</span>
          </header>
          <div id="chat-slot" class="chat-slot">
            <div class="chat-empty">
              <p>画面上部の配信名を押すと、その配信のチャットを表示します。</p>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message"></span>
      <button id="toast-action" class="toast__action" type="button">元に戻す</button>
    </div>

    <template id="stream-card-template">
      <article class="stream-card">
        <header class="stream-card__header">
          <button class="stream-card__select" type="button">
            <span class="stream-card__indicator" aria-hidden="true"></span>
            <span class="stream-card__name"></span>
            <span class="stream-card__provider"></span>
          </button>
          <button class="stream-card__remove" type="button" title="配信を削除">×</button>
        </header>
        <div class="stream-card__media">
          <div class="embed-loading" role="status">配信を読み込み中</div>
          <iframe
            class="stream-frame"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
      </article>
    </template>

    <noscript>このアプリにはJavaScriptが必要です。</noscript>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
